name: Metals Trading Bot

on:
  workflow_dispatch:
  schedule:
    # Every 15 minutes during 12:00-15:59 UTC, Monday-Friday. The forward-test
    # strategy only trades US macro hours, and it decides on 15-minute bars, so an
    # hourly schedule would see one bar in four and miss most qualifying setups -
    # the test would measure the cron schedule rather than the strategy.
    # GitHub's scheduler is best-effort and can run several minutes late under load;
    # the bot is idempotent per bar, so a late or duplicated run is harmless.
    - cron: "0,15,30,45 12-15 * * 1-5"

permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        run: python bot.py
        env:
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          IS_DEMO: ${{ secrets.IS_DEMO }}
          BALANCE_CAP: ${{ vars.BALANCE_CAP }}
          STRATEGY: ${{ vars.STRATEGY }}
          VOL_MANAGED_SIZING: ${{ vars.VOL_MANAGED_SIZING }}
          RISK_PER_TRADE: ${{ vars.RISK_PER_TRADE }}
          VOL_REGIME_MIN: ${{ vars.VOL_REGIME_MIN }}
          GITHUB_USERNAME: kshitij406
          GITHUB_REPO: capital.com-metal-trading-bot

      - name: Persist trades.db and stats.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f trades.db stats.json
          git diff --cached --quiet || git commit -m "Update trades.db and stats.json [skip ci]"
          git pull --rebase origin main && git push origin main || \
            (git pull --rebase origin main && git push origin main)
